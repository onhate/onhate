<svg xmlns="http://www.w3.org/2000/svg" width="400" height="660" viewBox="0 0 400 660" role="img" aria-labelledby="graphic-title graphic-description" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><title id="graphic-title">Human experience. AI in practice.</title><desc id="graphic-description">Human coding: 10,749 hrs; 11.54M lines added by hand. AI coding: 1,982 hrs; 1.26M lines added by AI. Last 30 days: Markdown 33.6%; Python 26.1%; TypeScript 18.4%; Remaining languages 21.9%</desc><style>:root{--tone-bg:#ffffff;--tone-ink:#1f2328;--tone-muted:#59636e;--tone-border:#d1d9e0;--tone-soft:#f6f8fa;--tone-human:#0969da;--tone-ai:#8250df;--tone-human_soft:#f1f7ff;--tone-ai_soft:#f8f3ff;--tone-track:#e3e7eb;--tone-language_1:#3178c6;--tone-language_2:#b35c00;--tone-language_3:#9a7b00}@media (prefers-color-scheme: dark){:root{--tone-bg:#0d1117;--tone-ink:#e6edf3;--tone-muted:#9198a1;--tone-border:#30363d;--tone-soft:#161b22;--tone-human:#58a6ff;--tone-ai:#bc8cff;--tone-human_soft:#101c2d;--tone-ai_soft:#1c152b;--tone-track:#303943;--tone-language_1:#58a6ff;--tone-language_2:#f4a454;--tone-language_3:#e3c84a}}</style><rect x="1" y="1" width="398" height="658" fill="var(--tone-bg)" rx="16" stroke="var(--tone-border)" /><rect x="2" y="2" width="396" height="656" rx="15" fill="url(#banner-background)" /><text x="32" y="34" font-size="14" fill="var(--tone-muted)" font-weight="500">ONHATE · DEVELOPER ACTIVITY</text><defs><linearGradient id="banner-background"><stop offset="0%" stop-color="var(--tone-human_soft)" /><stop offset="48%" stop-color="var(--tone-bg)" /><stop offset="100%" stop-color="var(--tone-ai_soft)" /></linearGradient><clipPath id="language-name-0"><rect x="48" y="495" width="256" height="23" /></clipPath><clipPath id="language-name-1"><rect x="48" y="520" width="256" height="23" /></clipPath><clipPath id="language-name-2"><rect x="48" y="545" width="256" height="23" /></clipPath><clipPath id="language-name-3"><rect x="48" y="570" width="25